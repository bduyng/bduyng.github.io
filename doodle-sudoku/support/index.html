<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support — Doodle Sudoku</title>
    <meta name="description" content="Support contact for Doodle Sudoku." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1c1917;
        --muted: #57534e;
        --paper: #fffaf3;
        --accent-soft: #e0f2fe;
      }
      body {
        margin: 0;
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 80% 10%, #ecfccb 0, transparent 40%),
          var(--paper);
        line-height: 1.65;
      }
      .wrap {
        max-width: 36rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-size: 2.25rem;
        margin: 0 0 0.75rem;
      }
      .card {
        background: #fff;
        border: 2px solid #e7e5e4;
        border-radius: 1.25rem;
        padding: 1.5rem;
        box-shadow: 4px 4px 0 rgba(28, 25, 23, 0.06);
      }
      a {
        color: #0369a1;
        font-weight: 600;
      }
      .btn {
        display: inline-block;
        margin-top: 1rem;
        background: var(--accent-soft);
        border: 2px solid #7dd3fc;
        border-radius: 999px;
        padding: 0.65rem 1.1rem;
        text-decoration: none;
        color: #0c4a6e;
      }
      .links {
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Support</h1>
      <div class="card">
        <p>
          Need help with Doodle Sudoku — gameplay, Pro, restores, or privacy?
          Email us and we’ll get back as soon as we can.
        </p>
        <p>
          <strong>Email:</strong>
          <a href="mailto:bduyng@gmail.com?subject=Doodle%20Sudoku%20Support"
            >bduyng@gmail.com</a
          >
        </p>
        <a
          class="btn"
          href="mailto:bduyng@gmail.com?subject=Doodle%20Sudoku%20Support"
          >Write a message</a
        >
      </div>
      <p class="links">
        <a href="../privacy/">Privacy Policy</a>
        ·
        <a href="../">Home</a>
      </p>
    </main>
  </body>
</html>
